<!-- NC Election Night Results: paste this whole block into a WPCode HTML snippet (or a Divi "Code" module).
     The script loads the tracker after the rest of the page, sizes the frame and passes on ?test.
     When index.html changes on GitHub, change VERSION below (and in data-src) so browsers load the new copy. -->
<style>
/* On this page only: keep the site header solid NCFREE blue, so its white logo and menu never sit on a light background. */
body.et_transparent_nav #page-container #top-header,body.et_transparent_nav #page-container #main-header{background-color:#00698F!important}
/* Blue page banner in the same style as the early voting tracker's. */
#ncen-hero{background:#00698F;color:#fff;padding:170px 0 56px;font-family:athelas,"Source Serif 4",Georgia,serif}
#ncen-hero .ncen-in{max-width:calc(1100px + 2 * clamp(18px,4vw,40px));margin:0 auto;padding:0 clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
#ncen-hero p,#ncen-hero h1{margin:0;padding:0;color:#fff}
#ncen-hero .ncen-eyebrow{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
#ncen-hero h1{font-size:clamp(34px,5vw,48px);line-height:1.1;font-weight:700}
#ncen-hero .ncen-rule{width:56px;height:4px;background:#92C74C}
#ncen-hero .ncen-dek{font-size:20px;line-height:1.45;max-width:760px}
@media (max-width:820px){#ncen-hero{padding:120px 0 40px}}
</style>
<div id="ncen-wrap" style="width:100%;max-width:none;margin:0">
  <section id="ncen-hero"><div class="ncen-in">
    <p class="ncen-eyebrow">NCFREE research · 2026 General Election</p>
    <h1>North Carolina Election Night Results</h1>
    <div class="ncen-rule"></div>
    <p class="ncen-dek">Unofficial results for statewide, congressional and legislative races, from the NC State Board of Elections. Results update automatically as counties report.</p>
  </div></section>
  <iframe id="ncen" data-src="https://brendanhiggs.github.io/election-night-tracker/?v=2026-11-02c" title="North Carolina Election Night Results" style="width:100%;border:0;display:block;height:1600px" loading="eager" allow="clipboard-write"></iframe>
  <noscript><p><a href="https://brendanhiggs.github.io/election-night-tracker/">Open the NC Election Night Results</a></p></noscript>
</div>
<script>
(function(){
  var TRACKER_URL='https://brendanhiggs.github.io/election-night-tracker/';
  var f=document.getElementById('ncen');
  // ?test on this page's address turns on the tracker's test mode (reads NCSBE's 2024 file).
  var test=/[?&]test\b/.test(location.search);
  // #nch-37 style links on this page open the tracker on that view.
  // VERSION makes browsers fetch the newest tracker instead of an old saved copy. Change it whenever index.html is updated on GitHub.
  var VERSION='2026-11-02c';
  var url=test?TRACKER_URL+'?test=1'+String.fromCharCode(38)+'v='+VERSION+(location.hash||''):TRACKER_URL+'?v='+VERSION+(location.hash||'');
  // Start loading the tracker after the rest of the page has loaded, so the site's own header and menu are never held up by it.
  function go(){if(!f.getAttribute('src'))f.src=url;}
  if(document.readyState==='complete')go();else window.addEventListener('load',go);setTimeout(go,4000);
  // Stretch the tracker from edge to edge of the browser window, whatever the width of the Divi row it sits in.
  var wrap=document.getElementById('ncen-wrap');
  function bleed(){wrap.style.marginLeft='0';var w=document.documentElement.clientWidth,l=wrap.getBoundingClientRect().left;wrap.style.width=w+'px';wrap.style.marginLeft=(-l)+'px';}
  // Pull the banner up to the top of the page so it sits behind the site's header, as on the early voting page.
  function fitTop(){var hdr=document.getElementById('main-header');if(hdr){if(hdr.classList.contains('et-fixed-header'))return;}
    wrap.style.marginTop='0';var y=window.pageYOffset||0;var wrapTop=wrap.getBoundingClientRect().top+y;
    var pageTop=document.documentElement.getBoundingClientRect().top+y;var bar=document.getElementById('wpadminbar');var barH=bar?bar.offsetHeight:0;
    wrap.style.marginTop=(-(wrapTop-pageTop-barH))+'px';}
  function layout(){bleed();fitTop();}
  layout();window.addEventListener('resize',layout);window.addEventListener('load',layout);setTimeout(layout,1500);
  var origin=new URL(TRACKER_URL).origin;
  window.addEventListener('message',function(e){
    if(e.origin!==origin||!e.data||!e.data.ncen)return;
    if(e.data.ncen==='height'){if(e.data.h>200){f.style.height=e.data.h+'px';}}
    sendView();
    if(e.data.ncen==='hash'){if(typeof e.data.hash==='string'){if(/^[\w-]{1,40}$/.test(e.data.hash)){
      try{history.replaceState(null,'','#'+e.data.hash);}catch(err){}
    }}}
  });
  // Tell the tracker which part of it is on screen, so its "Latest from NCFREE" card stays in the corner of the screen.
  function sendView(){var r=f.getBoundingClientRect();if(!f.contentWindow)return;
    var top=Math.max(0,-r.top),h=Math.min(window.innerHeight,r.bottom)-Math.max(0,r.top);
    f.contentWindow.postMessage({ncen:'view',top:top,h:h},origin);}
  window.addEventListener('scroll',sendView,{passive:true});window.addEventListener('resize',sendView);f.addEventListener('load',sendView);
})();
</script>
