<!-- NC Election Night Results: paste this whole block into a WordPress "Custom HTML" block.
     If you move the site (custom domain, NCFREE organization), change TRACKER_URL below. -->
<div id="ncen-wrap" style="width:100%;max-width:1180px;margin:0 auto">
  <iframe id="ncen" title="North Carolina Election Night Results"
    style="width:100%;border:0;display:block;min-height:1400px;overflow:hidden" scrolling="no" loading="eager"
    allow="clipboard-write"></iframe>
  <noscript><p><a href="https://brendanhiggs.github.io/nc-election-night-tracker/">Open the NC Election Night Results</a></p></noscript>
</div>
<script>
(function(){
  var TRACKER_URL='https://brendanhiggs.github.io/nc-election-night-tracker/';
  var f=document.getElementById('ncen');
  // ?test on this page's address turns on the tracker's test mode (reads NCSBE's 2024 file).
  var test=/[?&]test\b/.test(location.search);
  // #nch-37 style links on this page open the tracker on that view.
  f.src=TRACKER_URL+(test?'?test':'')+(location.hash||'');
  var origin=new URL(TRACKER_URL).origin;
  window.addEventListener('message',function(e){
    if(e.origin!==origin||!e.data||!e.data.ncen)return;
    if(e.data.ncen==='height'&&e.data.h>200){f.style.minHeight='0';f.style.height=e.data.h+'px';}
    sendView();
    if(e.data.ncen==='hash'&&typeof e.data.hash==='string'&&/^[\w-]{1,40}$/.test(e.data.hash)){
      try{history.replaceState(null,'','#'+e.data.hash);}catch(err){}
    }
  });
  // Tell the tracker which part of it is on screen, so its "Latest from NCFREE" card stays in the corner of the screen.
  function sendView(){var r=f.getBoundingClientRect();if(!f.contentWindow)return;
    var top=Math.max(0,-r.top),h=Math.min(window.innerHeight,r.bottom)-Math.max(0,r.top);
    f.contentWindow.postMessage({ncen:'view',top:top,h:h},origin);}
  window.addEventListener('scroll',sendView,{passive:true});window.addEventListener('resize',sendView);f.addEventListener('load',sendView);
})();
</script>
